<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a363d" />
      <stop offset="100%" stop-color="#145561" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a363d" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon/Shield Container -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#primaryGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle Inner Ring -->
  <rect x="7" y="7" width="86" height="86" rx="23" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Maternal Caring Embrace & Stethoscope Harmony Emblem -->
  <!-- Outer Mother Figure Curve (Protective Arc) -->
  <path d="M 50 18 C 65 18, 77 29, 78 44 C 79 56, 72 67, 63 74 C 58 78, 52 82, 50 82 C 48 82, 42 78, 37 74 C 28 67, 21 56, 22 44 C 23 29, 35 18, 50 18 Z" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Central Heart & Blossom Bud (New Life / Childbirth) -->
  <path d="M 50 40 C 47 34, 40 34, 38 39 C 35 44, 38 51, 50 61 C 62 51, 65 44, 62 39 C 60 34, 53 34, 50 40 Z" 
        fill="url(#goldGrad)" />

  <!-- Medical Cross Accent (Harmonious Center Piece) -->
  <path d="M 50 30 L 50 36 M 47 33 L 53 33" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Gentle Stethoscope Integration Arc -->
  <path d="M 32 54 C 32 68, 42 75, 50 75 C 58 75, 68 68, 68 54" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-dasharray="0.5 0.5" />

  <!-- Stethoscope Binaural Earpiece Dots -->
  <circle cx="32" cy="52" r="2.5" fill="#ffffff" />
  <circle cx="68" cy="52" r="2.5" fill="#ffffff" />

  <!-- Bottom Accent Sparkle -->
  <circle cx="50" cy="84" r="2" fill="#fbbf24" />
</svg>